<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="To-do list">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>To-do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="today-card" aria-labelledby="today-title">
      <div class="section-top"><h2 id="today-title">Today's to-do list</h2><span id="today-date"></span></div>
      <div id="today-summary"></div>
      <button id="open-today" class="text-button" type="button">Add to-do list ↗</button>
    </section>
    <section class="calendar-card" aria-labelledby="month-title">
      <div class="month-toolbar"><h2 id="month-title" aria-live="polite"></h2><div class="month-controls"><button id="go-today" class="today-button" type="button">오늘</button><button id="prev-month" class="arrow" type="button" aria-label="이전 달">‹</button><button id="next-month" class="arrow" type="button" aria-label="다음 달">›</button></div></div>
      <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="calendar" class="calendar" role="group" aria-label="날짜 선택"></div>
    </section>
    <p id="notice" role="status" hidden></p>
  </main>
  <dialog id="day-dialog" aria-labelledby="day-title">
    <div class="dialog-heading"><h2 id="day-title"></h2><button id="close-dialog" class="close-button" type="button" aria-label="달력으로 돌아가기">×</button></div>
    <form id="todo-form"><label class="sr-only" for="todo-input">새로운 할 일</label><input id="todo-input" maxlength="300" placeholder="할 일 입력" autocomplete="off" required><button type="submit" aria-label="할 일 추가">+</button></form>
    <ul id="todo-list" class="todo-list"></ul>
    <p class="gesture-hint">글자를 누르면 내용·날짜 변경 · 꾹 누르면 순서 이동</p>
    <p id="day-notice" role="status" hidden></p>
  </dialog>
  <dialog id="task-dialog" aria-labelledby="task-title">
    <div class="dialog-heading"><h2 id="task-title">할 일 옵션</h2><button id="close-task" class="close-button" type="button" aria-label="옵션 닫기">×</button></div>
    <p id="task-text"></p>
    <button id="edit-task" class="task-action" type="button">내용 수정</button>
    <form id="edit-task-form" hidden>
      <label for="edit-task-input">할 일 내용</label>
      <input id="edit-task-input" maxlength="300" autocomplete="off" required aria-describedby="edit-task-error">
      <p id="edit-task-error" role="status" hidden>할 일 내용을 입력해 주세요.</p>
      <div class="edit-actions"><button id="cancel-edit" type="button">취소</button><button type="submit">저장</button></div>
    </form>
    <button id="move-tomorrow" class="task-action" type="button">내일 하기</button>
    <button id="choose-date" class="task-action" type="button">다른 날짜에 하기</button>
    <form id="move-date-form" hidden>
      <label for="move-date">옮길 날짜</label>
      <input id="move-date" type="date" required>
      <button type="submit">날짜 변경</button>
    </form>
    <div class="order-actions"><button id="move-up" class="task-action" type="button">↑ 위로 이동</button><button id="move-down" class="task-action" type="button">↓ 아래로 이동</button></div>
  </dialog>
</body>
</html>
